name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        run: python -m PyInstaller build.spec --distpath dist --workpath build_temp --clean -y

      - name: Create release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/KidsVillage_Collector | Out-Null
          Copy-Item dist/KidsVillage_Collector.exe release/KidsVillage_Collector/
          Copy-Item docs/USER_GUIDE.md release/KidsVillage_Collector/사용설명서.md
          Copy-Item input_example.csv release/KidsVillage_Collector/
          Copy-Item .credentials.yaml.example release/KidsVillage_Collector/로그인설정_예시.yaml
          Compress-Archive -Path release/KidsVillage_Collector/* -DestinationPath release/KidsVillage_Collector_Windows.zip -Force
          (Get-FileHash release/KidsVillage_Collector_Windows.zip -Algorithm SHA256).Hash + "  KidsVillage_Collector_Windows.zip" | Set-Content release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: KidsVillage_Collector_Windows
          path: |
            release/KidsVillage_Collector_Windows.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release/KidsVillage_Collector_Windows.zip release/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag release/KidsVillage_Collector_Windows.zip release/SHA256SUMS.txt --generate-notes --title $tag
          }
